name: Android CI

# 每次 push / PR 自动执行三件事：Gradle 编译、单元测试、构建 Debug APK。
# 只使用本仓库自带的测试（app/src/test），不引入任何外部仓库的测试。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 · 单元测试 · APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需的 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" \
            || echo "::warning::SDK 组件预安装失败，交由 Gradle 自动下载"

      - name: Gradle 编译
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
