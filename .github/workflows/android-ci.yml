name: Android CI

# 每次 push / PR 自动执行三件事：Gradle 编译、单元测试、构建 Debug APK。
# 只使用本仓库自带的测试（app/src/test），不引入任何外部仓库的测试。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 · 单元测试 · APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 说明：ubuntu-24.04 runner 已预装 Android 命令行工具与 SDK，ANDROID_SDK_ROOT 已设好。
      # 不使用 android-actions/setup-android —— 它内部会执行 `sdkmanager tools`，
      # 而旧的 "tools" 包已从 SDK 源中移除，会让该动作直接失败（实测 exit 1）。
      - name: 安装编译所需的 SDK 组件
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" \
            || echo "::warning::SDK 组件预安装未成功，交由 Gradle 自动下载"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Gradle 编译
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
